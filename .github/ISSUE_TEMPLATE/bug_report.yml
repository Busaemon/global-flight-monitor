name: バグ・表示・アクセシビリティの報告
description: 再現手順と期待する動作をまとめる
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        OAuth secret、.env、DB、認証トークンは添付しないでください。
        脆弱性の詳細は SECURITY.md の非公開報告手順を使用してください。
  - type: textarea
    id: behavior
    attributes:
      label: 発生した動作と期待する動作
      description: ライブ / デモ、地図 / 一覧 / 詳細 / PWA のどの機能か記載します。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      placeholder: |
        1. 画面を開く
        2. コールサインを検索する
        3. 詳細を開く
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: アプリのコミットまたはブランチ
      description: 不明の場合は「不明」と記載します。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 動作環境
      description: OS、ブラウザー、画面幅、Node.js、本番 / 開発、ホーム画面 / 通常タブ、通信状態。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: エラー・画像・補足
      description: 観測時刻、API の状態、入力方法（タッチ / キーボード / 読み上げ）など。秘密の値を除いてください。
